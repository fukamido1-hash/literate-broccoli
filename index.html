<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 昭和の名画座・マイ視聴録クラウド</title>
    <style>
      .movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* 画面幅に合わせて自動調整 */
    gap: 20px;
    justify-items: center;
}
.card {
    width: 100%; /* グリッドに合わせて幅を自動にする */
    max-width: 350px;
}
/* 媒体ラベルのスタイル */
.platform-label {
    font-size: 10px;
    background: #444;
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 5px;
}
        :root { --neon-pink: #ff00ff; --neon-blue: #00ffff; --gold: #ffd700; }
        body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background: #121212; color: #fff; line-height: 1.5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        
        /* ログイン画面 */
        #auth-screen { text-align: center; padding: 50px 20px; }
        .login-btn { background: white; color: #444; padding: 15px 30px; border-radius: 5px; font-weight: bold; font-size: 18px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }

        /* メインコンテンツ */
        #main-content { display: none; }
        
        .hall-of-fame { background: #000; color: #ff3300; padding: 10px 0; font-family: monospace; font-size: 20px; overflow: hidden; white-space: nowrap; margin-bottom: 25px; border: 4px double #444; box-shadow: 0 0 15px #ff3300; }
        .marquee { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; font-weight: bold; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        .input-form { background: #2a2a2a; padding: 20px; border-radius: 10px; border: 1px solid #444; margin-bottom: 25px; }
        input, textarea, select { background: #111; color: #ffffff; border: 1px solid #555; padding: 12px; border-radius: 5px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        
        .roulette-box { margin: 25px 0; background: #000; border: 4px solid var(--gold); padding: 25px; border-radius: 12px; text-align: center; }
        #roulette-result { font-size: 32px; font-weight: bold; color: var(--gold); min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .flash-effect { animation: flash 0.2s ease-out 5; }
        @keyframes flash { 0%, 100% { background: #000; } 50% { background: var(--gold); color: #000; } }

        .card { background: #252525; border: 1px solid #333; padding: 15px; width: 260px; border-radius: 5px; position: relative; border-top: 8px solid #444; box-shadow: 5px 5px 0px #000; }
        .tag { background: #2980b9; color: white; font-size: 11px; padding: 3px 10px; border-radius: 20px; margin-right: 5px; font-weight: bold; }
        
        button { cursor: pointer; background: #c0392b; color: white; border: none; font-weight: bold; padding: 12px 20px; border-radius: 5px; }
        #user-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; color: #aaa; }
        /* --- ここから下を <style> 内の最後の方に追加！ --- */

.tag-candidate {
    display: inline-block;
    background: #222;
    color: var(--neon-blue);
    padding: 3px 10px;
    border-radius: 15px;
    font-size: 11px;
    margin-right: 6px;
    margin-bottom: 6px;
    cursor: pointer;
    border: 1px solid var(--neon-blue);
    transition: 0.2s;
}

.tag-candidate:hover {
    background: var(--neon-blue);
    color: #000;
}
    </style>
</head>
<body>

<div id="auth-screen">
    <h1 style="color:var(--gold); font-size: 40px; text-shadow: 3px 3px #000;">THE 視聴録</h1>
    <p>あなた専用のフィルム保管庫。ログインして始めましょう。</p>
    <button class="login-btn" onclick="login()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Googleでログイン
    </button>
</div>

<div id="main-content">
    <div id="user-info">
        <span id="user-name"></span>
        <button onclick="logout()" style="padding: 5px 10px; font-size: 12px; background: #444;">ログアウト</button>
    </div>

    <div class="hall-of-fame">
        <div id="hall-of-fame-list" class="marquee">【今夜のノミネート】 名作が次々と蘇る！ 🎬 </div>
    </div>

   <div class="container">
    <div id="main-content">
        <div class="input-form">
            <select id="movie-select" onchange="selectFromHistory()"><option value="">-- 過去作から選ぶ --</option></select>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="movie-title" placeholder="作品タイトル" style="flex: 2; margin-bottom: 0;">
                <input type="text" id="movie-tags" placeholder="🏷 ジャンル/タグ" style="flex: 1; margin-bottom: 0;">
            </div>
            <div id="tag-cloud" style="margin-bottom: 10px; min-height: 20px;"></div>

            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <select id="movie-platform" style="flex: 1; margin-bottom: 0;">
                    <option value="🎥 映画館">🎥 映画館</option>
                    <option value="📺 配信">📺 配信</option>
                    <option value="💿 DVD/BD">💿 DVD/BD</option>
                    <option value="📻 その他">📻 その他</option>
                </select>
                <input type="month" id="movie-date" style="flex: 1; margin-bottom: 0;" onclick="this.showPicker()">
                <input type="number" id="movie-score" placeholder="点数" style="flex: 0.6; margin-bottom: 0;">
                <button id="save-btn" onclick="addMovie()" style="flex: 1; background: #27ae60;">💾 保存</button>
            </div>
            <textarea id="movie-comment" placeholder="熱い想いを一行で！" rows="2"></textarea>
        </div>

        <div class="roulette-box">
            <select id="roulette-mode" style="width: auto; background: #222; margin-bottom: 10px;">
                <option value="0">全ての作品から抽選</option>
                <option value="90">90点以上から抽選</option>
                <option value="100">100点以上から抽選</option>
                <option value="120">120点のみ抽選</option>
            </select><br>
            <button onclick="startRoulette()" style="background: #e74c3c; width: 80%;">🎰 今夜の推薦作品を抽選</button>
            <div id="roulette-result">・・・</div>
        </div>

        <div id="year-filter-container" style="margin-bottom: 10px; text-align: center;"></div>
        <div id="genre-filter-container" style="margin-bottom: 20px; text-align: center;"></div>

        <input type="text" id="search-input" placeholder="🔍 自由検索..." oninput="refreshDisplay()" style="margin-bottom: 25px;">
        <div id="movie-list" class="movie-grid"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDGwwxmsvTu03gubuBAmEnOEl7K5DZpC5M",
        authDomain: "my-movie-theater-b7865.firebaseapp.com",
        projectId: "my-movie-theater-b7865",
        storageBucket: "my-movie-theater-b7865.firebasestorage.app",
        messagingSenderId: "288132146142",
        appId: "1:288132146142:web:040705c5e22575cfb3734f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let allMovies = [];
    let editingId = null;
    window.selectedYear = ""; // 選んでいる年を覚える箱

    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('user-name').innerText = user.displayName + " さん";
            syncMovies();
        } else {
            document.getElementById('auth-screen').style.display = 'block';
            document.getElementById('main-content').style.display = 'none';
        }
    });

    function syncMovies() {
        const q = query(collection(db, "movies"), where("uid", "==", currentUser.uid), orderBy("date", "desc"));
        onSnapshot(q, (snapshot) => {
            allMovies = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            refreshDisplay();
        });
    }

   // 保存処理に「媒体」を追加
    window.addMovie = async () => {
        const title = document.getElementById('movie-title').value.trim();
        const tagInput = document.getElementById('movie-tags').value.trim();
        const date = document.getElementById('movie-date').value;
        const score = Number(document.getElementById('movie-score').value) || 0;
        const comment = document.getElementById('movie-comment').value.trim();
        const platform = document.getElementById('movie-platform').value; // ★媒体
        
        if (!title || !date) return alert("タイトルと年月を入れてね！");
        const tags = tagInput.split(/[\s,、]+/).filter(t => t !== "");
        const movieData = { uid: currentUser.uid, title, tags, date, score, comment, platform, updatedAt: Date.now() };

        if (editingId) {
            await updateDoc(doc(db, "movies", editingId), movieData);
            editingId = null;
        } else {
            movieData.createdAt = Date.now();
            await addDoc(collection(db, "movies"), movieData);
        }
        resetForm();
    };

    window.refreshDisplay = () => {
        const list = document.getElementById('movie-list');
        const qSearch = document.getElementById('search-input').value.toLowerCase();
        list.innerHTML = "";

        // --- ジャンルボタンの生成 ---
        const genreContainer = document.getElementById('genre-filter-container');
        if (genreContainer) {
            genreContainer.innerHTML = `<button onclick="window.selectedGenre=''; refreshDisplay()" style="background:${!window.selectedGenre ? 'var(--neon-blue)' : '#444'}; color:#000; margin:3px; padding:4px 8px; font-size:11px;">全ジャンル</button>`;
            const allTags = [...new Set(allMovies.flatMap(m => m.tags || []))].sort();
            allTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.innerText = "#" + tag;
                btn.style.cssText = `margin:3px; padding:4px 8px; font-size:11px; background:${window.selectedGenre === tag ? 'var(--neon-blue)' : '#222'}`;
                btn.onclick = () => { window.selectedGenre = tag; refreshDisplay(); };
                genreContainer.appendChild(btn);
            });
        }

        // --- タイトルごとにまとめて表示 ---
        const groups = {};
        allMovies.forEach(m => {
            if (!groups[m.title]) groups[m.title] = [];
            groups[m.title].push(m);
        });

        Object.keys(groups).forEach(title => {
            const history = groups[title].sort((a,b) => b.date.localeCompare(a.date)); // 日付順
            const latest = history[0];

            // フィルター（年・ジャンル・検索）
            const yearMatch = !window.selectedYear || history.some(h => h.date.startsWith(window.selectedYear));
            const genreMatch = !window.selectedGenre || (latest.tags || []).includes(window.selectedGenre);
            const textMatch = !qSearch || title.toLowerCase().includes(qSearch);

            if (!yearMatch || !genreMatch || !textMatch) return;

            const card = document.createElement('div');
            card.className = 'card';
            const maxScore = Math.max(...history.map(h => h.score));
            card.style.borderTopColor = maxScore >= 120 ? "var(--gold)" : (maxScore >= 100 ? "var(--neon-blue)" : "#444");

            card.innerHTML = `
                <div style="font-weight:bold; color:var(--gold); font-size:18px;">${title}</div>
                <div style="margin:8px 0;">${(latest.tags || []).map(t => `<span class="tag">#${t}</span>`).join("")}</div>
                <div style="background:#111; padding:8px; border-radius:5px; margin-top:10px;">
                    ${history.map((h, index) => `
                        <div style="font-size:12px; border-bottom:1px solid #333; padding:5px 0;">
                            <div style="display:flex; justify-content:space-between;">
                                <span><small class="platform-label">${h.platform || '??'}</small> <b>${history.length - index}回目</b></span>
                                <span>${h.date}：<b>${h.score}点</b></span>
                            </div>
                            <div style="font-size:11px; color:#aaa; margin-top:4px;">"${h.comment || ''}"</div>
                            <div style="text-align:right;">
                                <button onclick="editMovie('${h.id}')" style="background:none; color:#3498db; padding:0; font-size:11px;">✏️</button>
                                <button onclick="deleteMovie('${h.id}')" style="background:none; color:#e74c3c; padding:0; font-size:11px; margin-left:8px;">🗑️</button>
                            </div>
                        </div>
                    `).join("")}
                </div>
            `;
            list.appendChild(card);
        });
    };

    // ルーレットを条件付きに改造
    window.startRoulette = () => {
        const mode = Number(document.getElementById('roulette-mode').value);
        let candidates = allMovies;
        if (mode > 0) candidates = allMovies.filter(m => m.score >= mode);
        if (mode === 120) candidates = allMovies.filter(m => m.score === 120);

        const res = document.getElementById('roulette-result');
        if (candidates.length === 0) return alert("条件に合う作品がまだないよ！");
        
        let c = 0;
        const spin = () => {
            res.innerText = candidates[Math.floor(Math.random() * candidates.length)].title;
            if (c++ < 20) setTimeout(spin, 70);
            else { res.classList.add('flash-effect'); setTimeout(()=>res.classList.remove('flash-effect'), 2000); }
        }; spin();
    };
    window.filterByYear = (year) => {
        window.selectedYear = year;
        refreshDisplay();
    };
</script>
</body>
</html>
